name: bluejays-space

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bluejays}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bluejays-dev-only}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bluejays}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bluejays}
      POSTGRES_DB: ${POSTGRES_DB:-bluejays}
    ports:
      - '5432:5432'
    volumes:
      # Auto-loads on first volume init only.
      - ./web/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro,Z
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bluejays} -d ${POSTGRES_DB:-bluejays}']
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./web
      # Dev needs devDependencies (tailwind, @astrojs/check) present to run
      # `astro build`/`astro preview` against bind-mounted source — the final
      # `runtime` stage (used by Railway) strips them via --omit=dev.
      target: builder
    ports:
      - '4321:4321'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bluejays}:${POSTGRES_PASSWORD:-bluejays}@db:5432/${POSTGRES_DB:-bluejays}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-bluejays-images}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bluejays}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-bluejays-dev-only}
      # Canonical origin for absolute URLs (OG tags, RSS, sitemap). Local dev
      # defaults to localhost; production sets SITE_URL=https://bluejays.space
      # in the Railway dashboard.
      SITE_URL: ${SITE_URL:-http://localhost:4321}
      # Header link to the handles service. Production leaves this unset and
      # lets it derive handles.<site host>; locally that host resolves nowhere,
      # so point it at the compose `handles` service's published port.
      HANDLES_URL: ${HANDLES_URL:-http://localhost:8080}
      # Cloudflare Access — middleware skips verification in dev (NODE_ENV unset
      # in the builder stage), so these stay blank locally. Set in production.
      CF_ACCESS_TEAM: ${CF_ACCESS_TEAM:-}
      CF_ACCESS_AUD: ${CF_ACCESS_AUD:-}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    user: root # dev only: vite writes to /app/node_modules/.vite
    healthcheck:
      disable: true # prod image's strict healthcheck isn't useful in dev
    volumes:
      # Hot-reload: bind-mount source over the copied image tree.
      - ./web:/app:Z
      # Keep the container's installed node_modules, don't shadow with host's.
      - /app/node_modules
    # Build once then serve the built server. `astro dev` (hot-reload) can hang
    # in some Docker/WSL setups due to an Astro 7 / Rolldown optimizer issue;
    # `astro preview` runs the same standalone Node server the prod image ships,
    # so dev and prod stay consistent. For hot-reload, swap to:
    #   npx astro dev --host 0.0.0.0
    entrypoint: ['/bin/sh', '/app/docker-entrypoint-dev.sh']
    # --force replaces the lock in web/.astro/preview.json. That file records
    # the previous run's PID and lives in the bind-mounted source tree, so it
    # outlives the container: every recreation met a lock naming a PID that no
    # longer exists and refused to start. Nothing else can hold port 4321
    # inside a freshly started container, so the lock is always stale here.
    command: sh -c "npx astro build && npx astro preview --host 0.0.0.0 --force"

  handles:
    # Go service serving AT Protocol DID files for @user.bluejays.space Bluesky
    # handles, plus the request form. No db/minio dependency — it reads
    # handles.json. Deployed to Railway as its own service behind a
    # *.bluejays.space wildcard; see handles/README.md.
    #
    # Templates and static assets are compiled into the binary via //go:embed,
    # so a bind mount would not pick up edits. Rebuild to see template/CSS
    # changes:  docker compose up -d handles --build
    build: ./handles
    ports:
      - '8080:8080'
    environment:
      # Locally the wildcard subdomains don't resolve, so the DID route can't
      # be exercised end to end; this keeps the rendered page matching prod.
      # Set BASE_DOMAIN=localhost in .env to test <user>.localhost:8080 instead.
      BASE_DOMAIN: ${BASE_DOMAIN:-bluejays.space}
      HANDLES_FILE: ${HANDLES_FILE:-handles.json}
      # Blank locally: the request form returns an error instead of opening a PR.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-karanshukla/bluejays-space}

  classify:
    build: ./classify
    # Not started by `compose up` — run explicitly via the manual profile.
    profiles: ['manual']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bluejays}:${POSTGRES_PASSWORD:-bluejays}@db:5432/${POSTGRES_DB:-bluejays}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLASSIFIER_MODEL: ${CLASSIFIER_MODEL:-claude-haiku-4-5}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-bluejays-images}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-bluejays}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-bluejays-dev-only}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  notify:
    # Run-once Go cron job (like classify): emails NOTIFY_TO via SMTP2GO when
    # draft headlines are waiting in the /admin review queue. Not started by
    # `compose up` — run explicitly:  docker compose run --rm notify
    build: ./notify
    profiles: ['manual']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-bluejays}:${POSTGRES_PASSWORD:-bluejays}@db:5432/${POSTGRES_DB:-bluejays}
      NOTIFY_TO: ${NOTIFY_TO:-}
      SMTP2GO_USERNAME: ${SMTP2GO_USERNAME:-}
      SMTP2GO_KEY: ${SMTP2GO_KEY:-}
      SMTP2GO_HOST: ${SMTP2GO_HOST:-mail.smtp2go.com}
      SMTP2GO_PORT: ${SMTP2GO_PORT:-587}
      NOTIFY_FROM: ${NOTIFY_FROM:-bluejays.space <noreply@bluejays.space>}
      SITE_URL: ${SITE_URL:-http://localhost:4321}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  miniodata:
